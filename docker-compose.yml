services:
  byos-next:
    image: ghcr.io/rdiazlugo/epaper_byos_next:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password}@localhost:5432/byos_db?sslmode=disable}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - byos_network

volumes:
  postgres_data:
    driver: local

networks:
  byos_network:
    driver: bridge
