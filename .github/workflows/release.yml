name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_GITHUB: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Bump and Release
    runs-on: ubuntu-latest
    # allow tag pushes (head_commit == null) and skip if [skip release] on main
    if: github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      release_version: ${{ steps.bump.outputs.version || steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed to read previous version and tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Detect version context
        id: version
        run: |
          # If this is a tag push, just derive version from the tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "from_tag=true" >> "$GITHUB_OUTPUT"
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch push (e.g. main)
          CURRENT=$(node -p "require('./package.json').version")

          if git rev-parse HEAD^ >/dev/null 2>&1 && git show HEAD^:package.json >/tmp/prev_package.json 2>/dev/null; then
            PREVIOUS=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/prev_package.json','utf8')).version")
          else
            PREVIOUS="$CURRENT"
          fi

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            # version already bumped in this commit
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
          else
            # need to bump
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
          fi

          echo "from_tag=false" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump version (patch)
        id: bump
        if: steps.version.outputs.should_bump == 'true'
        run: |
          pnpm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.version.outputs.should_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: steps.version.outputs.should_bump == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json pnpm-lock.yaml || true
          git commit -m "chore(release): v${NEW_VERSION} [skip release]"
          git push origin HEAD

      - name: Create tag (for branch pushes)
        if: steps.version.outputs.from_tag == 'false'
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version || steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TAG="v${RELEASE_VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version || steps.version.outputs.version }}
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Release v${{ env.RELEASE_VERSION }}
          generate_release_notes: true

  # Build each platform on a native runner (no QEMU emulation) and push by
  # digest. The manifest list that ties them together is assembled in `merge`.
  build:
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare platform pair
        id: platform
        run: echo "pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push the image without tags; tags are applied to the manifest in merge.
          outputs: type=image,name=${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch manifest list from the per-platform digests and
  # apply the release tags to it.
  merge:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.release_version }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}
          tags: |
            # Explicit version from the release job
            type=raw,value=${{ env.RELEASE_VERSION }}
            # Optional: also tag as latest
            type=raw,value=latest
            # Keep other helpful tags
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
